spring.application.name=jlacervo

# Conexao com o MySQL. Usuario e senha NAO ficam no codigo: defina as variaveis de ambiente DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jlacervo}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Cria a tabela "livros" se nao existir e nunca apaga dados existentes.
spring.jpa.hibernate.ddl-auto=update