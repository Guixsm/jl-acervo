<!DOCTYPE html>
<html lang="pt-BR">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>
         J.L. Acervo
        </title>

          <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <header class="cabecalho-login">

    <h1>J.L Acervo</h1>

    <nav>
        <a href="#">Contato</a>
        <a href="#">Baixar</a>
    </nav>

</header>

        <div id="tela-login">

        <div class="painel-formulario">

    <div class="formulario-login">

        <div class="icones-livros">
        <img
            src="assets/Group 1.svg"
            alt="Ilustração de livros"
            class="icone-livros"
        >
    </div> 
        <h2>BEM-VINDO DE VOLTA!</h2>

        <form id="formulario-login">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Example@email.com"
                required
            >

            <label for="senha">Senha</label>
           <input
                type="password"
                id="senha"
                placeholder="Mínimo de 8 dígitos"
                minlength="8"
                required
            >

            <a href="#" class="link-recuperacao">Esqueceu a senha?</a>

            <button type="submit">Sign in</button>

            <div class="separador-login">
    <span>or</span>
</div> 
            <div class="botoes-sociais">
    <button type="button" class="botao-social">Google</button>
    <button type="button" class="botao-social">Facebook</button>
</div>
        </form>
    </div>
 </div>

    <div class="painel-imagem">
       <img
    src="assets/biblioteca.png"
    alt="Interior de uma biblioteca"
    class="imagem-biblioteca"
>
</div>
</div> 

    <div id="tela-biblioteca">
    
        <header>

            <h1> 
                J.L. Acervo
            </h1>

            <p>
                Sua biblioteca digital
            </p>
        </header>

        <main>
            
            <section>
                <h2>
                    Cadastrar novo livro
                </h2>

            </section>

            <form id="formulario-livro">
                
                <div class="campo">
                <label for="titulo">Título do livro</label>
                <input type="text" name="titulo" placeholder="Título do livro" required>
                </div>

                <div class="campo">
                <label for="autor">Nome do autor</label>
                <input type="text" name="autor" placeholder="Nome do autor" required>
                </div>

                <div class="campo">
                <label for="ano">Ano de publicação</label>
                <input type="number" name="ano" placeholder="Ano de publicação" required>
                </div>

                <div class="campo">
                <label for="genero">Gênero do livro</label>
                <input type="text" name="genero" placeholder="Gênero do livro" required>
                </div>

                <button type="submit" >Cadastrar</button>

            </form>

            <section>

                <h2>
                    Livros cadastrados
                </h2>

                    <input type="text" id="campo-busca" placeholder="Buscar por título ou autor">
                    
                <div id="lista-livros">

                </div>

            </section>

        </main>

            </div>

        <script src="script.js"></script>

    </body>

</html>
